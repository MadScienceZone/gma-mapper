[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gma-mapper"
version = "5.0.0a1"
description = "GMA Virtual Tabletop Battle Map Client (Python + PySide6)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Steven L. Willoughby", email = "steve@madscience.zone" }
]
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
sftp = ["paramiko>=3.4.0"]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
gma-mapper = "gma_mapper.__main__:main"
py-dieroller = "py_dieroller.__main__:main"
py-roll = "py_dieroller.roll:main"

[project.gui-scripts]
gma-mapper-gui = "gma_mapper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
ignore-patterns = ["^.*\\.egg-info$"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.typecheck]
generated-members = [
    ".*\\.connect",
    ".*\\.disconnect",
    ".*\\.emit",
]

[tool.pylint.messages_control]
disable = [
    "C",  # Convention (formatting, naming, docstrings)
    # Structural size/count thresholds inherent to Qt widgets and protocol routers
    "R0801",  # duplicate-code (shared Qt import headers / mirrored helpers)
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0904",  # too-many-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
]

